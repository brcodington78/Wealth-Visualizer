name: Update billionaire data

on:
  schedule:
    # Every day at 14:00 UTC
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest data
        run: node scripts/fetch-billionaires.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet data/billionaires.json; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/billionaires.json
          git commit -m "Update billionaire data"
          git push
